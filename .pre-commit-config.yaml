# Revisiones automáticas antes de cada commit.
# Instalar (o reinstalar tras cambiar este archivo) con:  uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Ruff y mypy corren con las versiones fijadas en uv.lock (las mismas que en CI).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (formato)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, markdown]  # ruff también formatea el código Python de los .md
      - id: mypy
        name: mypy (tipos)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # Mensaje de commit con el formato "tipo: descripción" (Conventional Commits).
      # Ejemplos válidos:  "feat: adaptador de Santa Fe"   "fix(http): reintentos en 429"
      - id: mensaje-commit
        name: "mensaje de commit (tipo: descripción)"
        language: pygrep
        entry: '\A(feat|fix|docs|test|chore|refactor|style|perf|ci|build)(\([a-z0-9-]+\))?!?: \S'
        args: [--negate, --multiline]
        stages: [commit-msg]
