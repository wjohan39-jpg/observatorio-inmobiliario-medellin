# Revisiones automáticas antes de cada commit.
# Instalar una sola vez con:  uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Ruff y mypy corren con las versiones fijadas en uv.lock (las mismas que en CI).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (formato)
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (tipos)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
