[project]
name = "observatorio-inmobiliario"
version = "0.1.0"
description = "Scraper, análisis y dashboard del mercado inmobiliario de Medellín."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "wjohan39-jpg" }]
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "protego>=0.7.0",
    "pyarrow>=26.0.1",
    "pydantic>=2",
]

[project.scripts]
observatorio = "observatorio_inmobiliario.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatorio_inmobiliario"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # los bloques de código de los documentos son ilustrativos

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (errores)
    "W",   # pycodestyle (advertencias)
    "F",   # pyflakes
    "I",   # orden de imports
    "UP",  # sintaxis moderna de Python
    "B",   # bugbear: errores comunes
    "SIM", # simplificaciones
    "N",   # convenciones de nombres (PEP 8)
]
ignore = [
    "N818",  # exige el sufijo "Error" (inglés); en español usamos el prefijo: ErrorDeDescarga
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["observatorio_inmobiliario"]

[[tool.mypy.overrides]]
# pyarrow no publica tipos. Su uso se limita a almacenamiento.py, que sí expone tipos.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-ra --strict-markers --doctest-modules"

[tool.coverage.run]
source = ["observatorio_inmobiliario"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
